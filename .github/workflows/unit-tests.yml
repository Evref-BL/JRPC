name: Unit Tests

on: [push,pull_request,workflow_dispatch]

jobs:
   unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # smalltalkCI no longer builds 64-bit images for Pharo 7 and 8;
        # those two versions are covered by their 32-bit builds.
        smalltalk:
          - Pharo64-15
          - Pharo64-14
          - Pharo64-13
          - Pharo64-12
          - Pharo64-11
          - Pharo64-10
          - Pharo64-9.0
          - Pharo32-8.0
          - Pharo32-7.0
          - Pharo32-6.1
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v6
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load Image and Run Tests
        run: smalltalkci -s ${{ matrix.smalltalk }} .smalltalkci/.unit-tests.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
      - name: Find the coverage report
        id: coverage
        if: ${{ success() && matrix.smalltalk == 'Pharo64-14' }}
        # smalltalkCI writes it next to the spec, which lives in .smalltalkci/
        run: |
          report="$(find . -path '*coverage/lcov.info' -print -quit)"
          test -s "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Coveralls
        if: ${{ success() && matrix.smalltalk == 'Pharo64-14' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.coverage.outputs.report }}
          format: lcov
          flag-name: Pharo64-14
          fail-on-error: false
